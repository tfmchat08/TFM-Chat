<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-9BUK7CLjPauDlGwoxfe+76ClAzvSFOU/QAVelulqDd8=' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://jifoamltmdgpawpjgrbz.supabase.co wss://jifoamltmdgpawpjgrbz.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="tMsDlqwE8_9rU1hRZCsr4mtYXxtmSkWJabBgR8gKa2w" />
  <title>TFM Chat</title>
  <meta name="description" content="TFM Chat - منصة الشات الرسمية للمعهد التكنولوجي العالي للعلوم المالية والإدارية بسوهاج">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://tfmchat08.github.io/TFM-Chat/">
  <meta property="og:title" content="TFM Chat">
  <meta property="og:description" content="منصة الشات الرسمية للمعهد التكنولوجي العالي للعلوم المالية والإدارية بسوهاج">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tfmchat08.github.io/TFM-Chat/">
  <meta property="og:image" content="https://tfmchat08.github.io/TFM-Chat/icon-512.png">
  <meta name="theme-color" content="#6e0819">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="stylesheet" href="ai.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
  <link rel="stylesheet" href="emoji.css?v=1">
  <link rel="stylesheet" href="modern.css?v=1">
  <link rel="stylesheet" href="chats.css?v=1">
  <link rel="stylesheet" href="modern2.css?v=16">
  <link rel="stylesheet" href="fx.css?v=1">
</head>
<body>

  <!-- شاشة الدخول وإنشاء الحساب -->
  <div id="auth-screen" class="screen">
    <div class="card">
      <div class="auth-prefs">
        <button class="ghost lang-toggle" type="button"></button>
        <button class="ghost theme-toggle" type="button"></button>
      </div>
      <img src="icon-512.png" alt="TFM" class="logo">
      <h1>TFM Chat</h1>
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login" data-i18n="login">دخول</button>
        <button class="auth-tab" data-mode="signup" data-i18n="signup">حساب جديد</button>
      </div>

      <div class="room-picker">
        <div>
          <label data-i18n="track">الشعبة</label>
          <select id="track-select">
            <option value="ar" data-i18n="trkAr">عربي</option>
            <option value="en" data-i18n="trkEn">انجليزي</option>
          </select>
        </div>
        <div>
          <label data-i18n="level">المستوى</label>
          <select id="level-select">
            <option value="1" data-i18n="lvl1">الأول</option>
            <option value="2" data-i18n="lvl2">الثاني</option>
            <option value="3" data-i18n="lvl3">الثالث</option>
            <option value="4" data-i18n="lvl4">الرابع</option>
          </select>
        </div>
      </div>

      <input id="email" type="email" data-i18n-ph="email" dir="ltr">
      <input id="password" type="password" data-i18n-ph="password" dir="ltr">
      <p id="pw-hint" class="hint hidden" data-i18n="pwRule"></p>

      <div id="signup-box" class="signup-box hidden">
        <img id="signup-preview" class="preview hidden" alt="">
        <input id="signup-avatar-input" type="file" accept="image/*" hidden>
      </div>

      <button id="auth-submit" class="primary"></button>
      <button id="google-btn" class="google-btn" type="button" data-i18n="google"></button>
      <button id="forgot-btn" class="link-btn" data-i18n="forgot"></button>
      <button id="contact-open" class="ghost" data-i18n="contact"></button>
      <p id="auth-msg" class="msg-text"></p>
    </div>

    <div class="auth-credits">
      <div>Developed by <b>Ahmed</b></div>
      <div>للتواصل:</div>
      <div dir="ltr">📞 01032512602</div>
      <div dir="ltr">✉️ business.developer0807@gmail.com</div>
    </div>
  </div>

  <!-- شاشة تغيير الباسورد بعد اللينك -->
  <div id="recovery-screen" class="screen hidden">
    <div class="card">
      <h1 data-i18n="recTitle"></h1>
      <p class="hint" data-i18n="pwRule"></p>
      <input id="new-password" type="password" data-i18n-ph="newPassword" dir="ltr">
      <button id="recovery-btn" class="primary" data-i18n="recSave"></button>
      <p id="rec-msg" class="msg-text"></p>
    </div>
  </div>

  <!-- شاشة الشات -->
  <div id="chat-screen" class="screen hidden">
    <header>
      <div id="user-box" class="user-box" title="الملف الشخصي">
        <img id="my-avatar" class="avatar" src="" alt="" hidden>
        <span id="user-label" class="user-label"></span>
      </div>
      <div class="header-actions">
        <button id="ai-open" class="ghost gear ai-head-btn" title="فهيم"><span class="ico ico-robot"></span></button>
        <button id="materials-btn" class="ghost gear" title="ملفات المادة">📚</button>
        <button id="members-btn" class="ghost gear" title="الأعضاء"><span class="ico ico-users"></span></button>
        <button id="settings-btn" class="ghost gear" title="الإعدادات"><span class="ico ico-gear"></span></button>
      </div>
    </header>

    <!-- شريط الشاتات الخمسة: ثابت فوق دايماً، والـ JS بيملّيه بالأسماء -->
    <div id="chat-tabs" class="chat-tabs"></div>

    <div id="search-bar" class="search-bar hidden">
      <input id="search-input" data-i18n-ph="searchPh" dir="auto">
      <button id="search-close" class="ghost">✕</button>
    </div>

    <div id="pinned-bar" class="pinned-bar hidden">
      <span id="pinned-text"></span>
    </div>

    <div id="messages"></div>

    <div id="typing-bar" class="typing-bar hidden"></div>

    <div id="reply-bar" class="reply-bar hidden">
      <span id="reply-text"></span>
      <button id="reply-cancel" class="ghost">✕</button>
    </div>

    <div class="composer">
      <input id="file-input" type="file" accept="image/*,video/*,application/pdf" hidden>
      <button id="attach-btn" class="ghost" title="إرفاق"><span class="ico ico-clip"></span></button>
      <button id="cam-btn" class="ghost" title="كاميرا"><span class="ico ico-camera"></span></button>
      <button id="mic-btn" class="ghost" title="صوت"><span class="ico ico-mic"></span></button>
      <input id="msg-input" data-i18n-ph="msgPh">
      <button id="send-btn" class="primary" data-i18n="send"></button>
    </div>

    <div class="credits" dir="ltr" style="font-size:13px;line-height:1.6;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;text-align:left">
      <div>
        <b>Ahmed</b><br>
        📞 01032512602<br>
        ✉️ business.developer0807@gmail.com
      </div>
      <div></div>
      <div style="text-align:right">© 2026 TFM Chat</div>
    </div>
  </div>

  <!-- قايمة الأعضاء (من الجنب) -->
  <aside id="members-panel" class="members-panel hidden">
    <div class="members-head">
      <h3 data-i18n="membersTitle"></h3>
      <button id="members-close" class="ghost">✕</button>
    </div>
    <div id="members-list" class="members-body"></div>
  </aside>

  <!-- تسليمات الواجب والدرجات (للأدمن والمرسل) -->
  <div id="subs-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="subs-title">📝 التسليمات</h3>
        <button id="subs-close" class="ghost">✕</button>
      </div>
      <div id="subs-list" class="mat-list"></div>
    </div>
  </div>

  <!-- ملفات المادة (لكل شعبة) -->
  <div id="materials-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>📚 ملفات المادة</h3>
        <button id="materials-close" class="ghost">✕</button>
      </div>
      <div id="assign-box" class="assign-box">
        <h4 class="assign-title-h">📝 الواجبات والمواعيد</h4>
        <button type="button" id="assign-ics" class="ghost mat-upload-btn">📅 تصدير المواعيد للتقويم</button>
        <form id="assign-form" class="assign-form">
          <input id="assign-title" placeholder="اسم الواجب" maxlength="80" required>
          <input id="assign-due" type="datetime-local">
          <textarea id="assign-details" placeholder="تفاصيل (اختياري)" rows="2"></textarea>
          <button type="submit" class="primary">➕ ضيف الواجب</button>
        </form>
        <div id="assign-list" class="mat-list"></div>
      </div>
      <div id="materials-upload" class="mat-upload hidden">
        <label class="primary mat-upload-btn" for="materials-input">📤 ارفع ملف للشعبة</label>
        <input id="materials-input" type="file" hidden>
      </div>
      <div id="materials-list" class="mat-list"></div>
    </div>
  </div>


  <!-- قايمة الإعدادات -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 data-i18n="settings"></h3>
        <button id="settings-close" class="ghost">✕</button>
      </div>
      <div class="set-list">
        <button id="set-avatar" class="set-item" data-i18n="changeAvatar" style="display:none"></button>
        <button id="set-name" class="set-item" data-i18n="changeName" style="display:none"></button>
        <button id="set-bg" class="set-item" data-i18n="changeBg" style="display:none"></button>
        <button id="set-history" class="set-item" data-i18n="history"></button>
        <button id="set-search" class="set-item" data-i18n="search"></button>
        <button id="set-notify" class="set-item" data-i18n="notifOn"></button>
        <button id="set-theme" class="set-item"></button>
        <button id="set-font" class="set-item" style="display:none"></button>
        <button id="set-install" class="set-item"></button>
        <button id="set-sound" class="set-item"></button>
        <button id="set-export" class="set-item"></button>
        <button id="set-quiz" class="set-item"></button>
        <button id="set-contact" class="set-item">📞 التواصل والشكاوي</button>
        <button id="set-fx" class="set-item">🎬 إيقاف الحركة</button>
        <button id="set-delete" class="set-item danger-btn" style="display:none"></button>
        <button id="set-logout" class="set-item danger-btn" data-i18n="logout" style="display:none"></button>
      </div>
    </div>
  </div>

  <!-- نافذة الملف الشخصي -->
  <div id="profile-modal" class="modal hidden">
    <div class="modal-box profile-box">
      <div class="modal-head">
        <h3 id="pf-title"></h3>
        <button id="profile-close" class="ghost">✕</button>
      </div>
      <div class="profile-body">
        <button id="pf-avatar-btn" class="pf-avatar" type="button">
          <img id="pf-avatar" alt="">
          <span class="pf-edit">📷</span>
        </button>
        <div class="pf-name-row">
          <span id="pf-name" class="pf-name"></span>
          <button id="pf-name-btn" class="ghost pf-mini" type="button">✏️</button>
        </div>
        <div id="pf-email" class="pf-email" dir="ltr"></div>
        <div class="pf-prefs">
          <button id="pf-font" class="pf-card" type="button">
            <span class="pf-card-ico">🔤</span>
            <span id="pf-font-t" class="pf-card-title"></span>
            <span id="pf-font-val" class="pf-card-val"></span>
          </button>
          <button id="pf-bg" class="pf-card" type="button">
            <span class="pf-card-ico">🖼️</span>
            <span id="pf-bg-t" class="pf-card-title"></span>
            <span class="pf-card-val">✨</span>
          </button>
        </div>
        <div id="pf-badges" class="pf-badges"></div>
        <div class="pf-actions">
          <button id="pf-logout" class="ghost" type="button"></button>
          <button id="pf-delete" class="danger-btn" type="button"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- نافذة خلفية الشات -->
  <div id="bg-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 data-i18n="chatBg"></h3>
        <button id="bg-close" class="ghost">✕</button>
      </div>
      <div id="bg-swatches"></div>
      <button id="bg-upload" class="set-item" data-i18n="uploadBg"></button>
      <button id="bg-reset" class="set-item danger-btn" data-i18n="resetBg"></button>
    </div>
  </div>

  <!-- بوابة صورة البروفايل -->
  <div id="avatar-gate" class="modal hidden">
    <div class="modal-box">
      <h3 id="pg-title"></h3>
      <p class="hint" id="pg-hint"></p>
      <input id="pg-name" type="text" maxlength="30" autocomplete="nickname">
      <input id="gate-input" type="file" accept="image/*">
      <button id="gate-save" class="primary" data-i18n="save"></button>
      <p id="gate-msg" class="msg-text"></p>
    </div>
  </div>

  <!-- قايمة الثلاث نقط للرسالة -->
  <div id="msg-menu" class="msg-menu hidden">
    <div id="menu-emojis" class="emo-row"></div>
    <button id="menu-reply" data-i18n="reply"></button>
    <button id="menu-edit" data-i18n="edit"></button>
    <button id="menu-copy" data-i18n="copy"></button>
    <button id="menu-search" data-i18n="search"></button>
    <button id="menu-pin" data-i18n="pin"></button>
    <button id="menu-delete" class="danger" data-i18n="delete"></button>
  </div>

  <!-- السجل -->
  <div id="history-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 data-i18n="history"></h3>
        <button id="history-close" class="ghost">✕</button>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="links" data-i18n="tabLinks"></button>
        <button class="tab" data-tab="docs" data-i18n="tabDocs"></button>
        <button class="tab" data-tab="media" data-i18n="tabMedia"></button>
      </div>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- الكاميرا -->
  <div id="cam-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 data-i18n="camera"></h3>
        <button id="cam-close" class="ghost">✕</button>
      </div>
      <video id="cam-video" autoplay playsinline></video>
      <canvas id="cam-canvas" hidden></canvas>
      <button id="cam-snap" class="primary" data-i18n="shoot"></button>
    </div>
  </div>

  <!-- التواصل والشكاوي -->
  <div id="contact-modal" class="modal hidden">
    <div class="modal-box contact-box">
      <div class="modal-head">
        <h3 data-i18n="contactTitle"></h3>
        <button id="contact-close" class="ghost">✕</button>
      </div>
      <p data-i18n="contactInfo"></p>
      <p class="contact-line">📞 01288257989</p>
      <p class="contact-line">📞 01501131414</p>
      <p data-i18n="emailLabel"></p>
      <p class="contact-line">tfmchat08@gmail.com</p>
      <textarea id="contact-msg" data-i18n-ph="contactPh"></textarea>
      <button id="contact-send" class="primary" data-i18n="contactBtn"></button>
    </div>
  </div>

  <!-- شات فاهم -->
  <div id="ai-chat-screen" class="ai-screen hidden">
    <div class="ai-head">
      <button id="ai-chat-back" class="ai-back" aria-label="back">
        <span class="arrow">→</span>
        <span id="ai-back-text" class="ai-back-text"></span>
      </button>
      <div class="ai-avatar"></div>
      <div class="ai-title">
        <b id="ai-name-ar">فهيم</b>
        <span id="ai-name-en" class="ai-en">Faheem</span>
        <small id="ai-room-label"></small>
      </div>
      <div class="ai-tools">
        <button id="ai-settings-btn" class="ghost small" title="الإعدادات"><span class="ico ico-gear"></span></button>
      </div>
    </div>

    <div id="ai-messages" class="ai-messages"></div>

    <div id="ai-file-name" class="ai-file-name hidden"></div>

    <div id="ai-status" class="ai-status hidden"></div>

    <div class="ai-composer">
      <input id="ai-file" type="file" accept="application/pdf,image/*" hidden>
      <button id="ai-attach" class="ghost" title="إرفاق"><span class="ico ico-clip"></span></button>
      <button id="ai-mic" class="ghost" title="صوت"><span class="ico ico-mic"></span></button>
      <input id="ai-input" dir="auto">
      <button id="ai-send" class="primary" title="ابعت"><span class="ico ico-send"></span></button>
    </div>
  </div>

  <!-- إعدادات فهيم -->
  <div id="ai-settings-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>إعدادات فهيم</h3>
        <button id="ai-settings-close" class="ghost">✕</button>
      </div>
      <div class="set-list">
        <button id="ai-books-open" class="set-item hidden">📚 إضافة كتب</button>
        <button id="ai-speak" class="set-item"></button>
        <button id="ai-lang" class="set-item"></button>
        <button id="ai-cards" class="set-item"><span class="ico ico-cards"></span> الكروت</button>
        <button id="ai-regen" class="set-item"><span class="ico ico-refresh"></span> أعد الرد</button>
        <button id="ai-clear" class="set-item danger-btn"><span class="ico ico-trash"></span> امسح الشات</button>
      </div>
      <div id="ai-books-admin" class="ai-books-admin hidden"></div>
    </div>
  </div>

  <input id="avatar-input" type="file" accept="image/*" hidden>
  <input id="bg-input" type="file" accept="image/*" hidden>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="app.js?v=34"></script>
  <script src="ai.js?v=14"></script>
  <script src="gate.js?v=3"></script>
  <script src="ai-warn.js?v=3"></script>
  <script src="prefs.js?v=3"></script>
  <script src="account.js?v=1"></script>
  <script src="quiz-link.js?v=1"></script>
  <script src="default-avatars.js?v=2"></script>
  <script src="chats.js?v=5"></script>
  <script src="icons.js?v=1"></script>
  <script src="fx.js?v=2"></script>
  <script src="badge.js?v=5"></script>
  <script src="notify.js?v=1"></script>
  <script src="materials.js?v=3"></script>
</body>
</html>
