<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://jifoamltmdgpawpjgrbz.supabase.co wss://jifoamltmdgpawpjgrbz.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>الاختبارات | TFM Chat</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="fx.css?v=1">
  <style>
    :root {
      --accent: #6e0819;
      --accent-soft: rgba(110, 8, 25, 0.08);
      --bg: #f4f1ee;
      --card: #ffffff;
      --line: #e6e1dc;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --ok: #1e7b43;
      --ok-soft: rgba(30, 123, 67, 0.1);
      --bad: #b3261e;
      --bad-soft: rgba(179, 38, 30, 0.08);
      --radius: 14px;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 18px rgba(0, 0, 0, 0.06);
      /* ألوان الخلفية المتحركة (نفس فكرة الشات) */
      --bg1: #f6eef0;
      --bg2: #fbf7f8;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --accent-soft: rgba(220, 80, 100, 0.12);
        --bg: #121214;
        --card: #1c1c20;
        --line: #2c2c33;
        --text: #f1f1f3;
        --muted: #9a9aa3;
        --ok-soft: rgba(60, 180, 110, 0.14);
        --bad-soft: rgba(230, 90, 80, 0.14);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
        --bg1: #1a0a10;
        --bg2: #3a0f1e;
      }
    }
    :root[data-theme="dark"] {
      --bg1: #1a0a10;
      --bg2: #3a0f1e;
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* الخلفية المتحركة (الافتراضي) */
    body {
      background: linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg1));
      background-size: 200% 200%;
      animation: bgShift 22s ease infinite;
    }
    /* الخلفية الهادية: تدرج ثابت من غير حركة */
    body.calm {
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      animation: none;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      padding: 16px;
      min-height: 100vh;
      line-height: 1.6;
    }
    .wrap { max-width: 760px; margin: 0 auto; }

    /* ===== الهيدر ===== */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .topbar h1 { margin: 0; font-size: 22px; color: var(--accent); flex: 1; }
    .topbar a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--accent-soft);
    }

    /* ===== أزرار عامة ===== */
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      padding: 8px 14px;
      font-size: 14px;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.primary { background: var(--accent); color: #fff; }
    button.danger { color: var(--bad); border-color: var(--bad); }
    button.ghost { border-color: var(--line); color: var(--muted); }
    button.icon { padding: 6px 12px; font-size: 16px; }
    .hist-btn { font-size: 18px; }

    /* ===== الكروت ===== */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 16px;
      margin: 0 0 10px;
      color: var(--accent);
    }
    .hint-line { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
    .empty-line { color: var(--muted); font-size: 14px; margin: 6px 0; }

    /* ===== الإنتقال بين اللوحات ===== */
    .tabs {
      display: flex;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 14px;
    }
    .tab {
      flex: 1;
      border: none;
      border-radius: 9px;
      padding: 10px;
      color: var(--muted);
      background: transparent;
      font-weight: 700;
    }
    .tab.active { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }
    .count-pill {
      display: inline-block;
      min-width: 24px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      margin-inline-start: 4px;
    }

    /* ===== فورم السؤال ===== */
    .q-form textarea,
    .q-form input[type="text"],
    .exam-make input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 8px;
    }
    .ans-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    .ans-row input[type="text"] { margin: 0; flex: 1; }
    .ans-row input[type="radio"] { width: 18px; height: 18px; accent-color: var(--accent); }
    .form-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

    /* ===== صفوف البنك والاختبارات ===== */
    .bank-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 10px;
    }
    .bank-item,
    .exam-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: var(--card);
    }
    .bank-top { display: flex; gap: 10px; align-items: flex-start; }
    .bank-top input.pick { width: 18px; height: 18px; margin-top: 4px; flex: 0 0 auto; accent-color: var(--accent); }
    .bank-q { font-weight: 700; flex: 1; }
    .bank-opts {
      font-size: 14px;
      color: var(--muted);
      margin: 8px 0 10px;
      padding-inline-start: 28px;
    }
    .bank-opts div { line-height: 1.9; }
    .exam-meta { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
    .row-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .row-btns button { padding: 6px 10px; font-size: 13px; }
    .row-btns select {
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
    }

    /* ===== إنشاء اختبار ===== */
    .exam-builder {
      border-top: 1px dashed var(--line);
      margin-top: 14px;
      padding-top: 14px;
    }
    .exam-make { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .exam-make input[type="text"] { flex: 1; min-width: 180px; margin: 0; }

    /* ===== الطالب ===== */
    .picker {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .picker select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      flex: 1;
      min-width: 140px;
    }
    #exam-head {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
    }
    #status {
      display: inline-block;
      color: var(--muted);
      font-size: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 14px;
    }
    .q {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin: 0 0 12px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease;
    }
    .q.ok { border-left-color: var(--ok); background: var(--ok-soft); }
    .q.bad { border-left-color: var(--bad); background: var(--bad-soft); }
    .q legend { font-weight: 700; padding: 0; margin-bottom: 8px; font-size: 16px; }
    .opt {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      background: var(--bg);
    }
    .opt:hover { border-color: var(--accent); }
    .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
    .opt input { width: 18px; height: 18px; flex: 0 0 auto; accent-color: var(--accent); }
    .hint { font-size: 14px; margin-top: 8px; font-weight: 600; }
    .hint.ok { color: var(--ok); }
    .hint.bad { color: var(--bad); }
    .actions { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
    .actions button { padding: 12px 20px; font-size: 16px; }
    #result {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      box-shadow: var(--shadow);
      color: var(--accent);
    }

    /* ===== الطباعة (لطباعة الامتحان) ===== */
    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .topbar a, .picker, #status, .actions, .staff-box, #history-box,
      #history-btn, #print-btn, #result, .tabs { display: none !important; }
      .q { box-shadow: none; break-inside: avoid; border: 1px solid #999; border-left-width: 1px; }
      .opt { border: 1px solid #ccc; background: #fff; }
      .opt input { accent-color: #000; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <header class="topbar">
      <a href="./">→ رجوع للشات</a>
      <h1>الاختبارات</h1>
      <button id="bg-toggle" class="icon ghost" type="button" title="الخلفية">🎨</button>
      <button id="history-btn" class="icon hist-btn" type="button" title="السجل" hidden>🕘</button>
    </header>

    <!-- السجل: كل الأسئلة المضافة للشعبة، تتعدّل أو تتمسح من هنا (للأدمن بس) -->
    <section id="history-box" class="card" hidden>
      <h2>🕘 السجل <span class="count-pill" id="count-hist">0</span></h2>
      <p class="hint-line">كل سؤال اتضاف للشعبة دي. تقدر تعدّله أو تمسحه من هنا.</p>
      <div id="history-list"></div>
    </section>

    <!-- لوحة الأستاذ: للأدمن والمرسل بس، وبتشتغل على شعبته هو بس -->
    <section id="staff-box" class="card" hidden>
      <nav class="tabs" role="tablist">
        <button class="tab active" type="button" data-tab="bank">📚 الأسئلة <span class="count-pill" id="count-staff">0</span></button>
        <button class="tab" type="button" data-tab="exams">📝 الاختبارات</button>
      </nav>

      <!-- لسان الأسئلة -->
      <div data-pane="bank">
        <div class="card" style="box-shadow:none; margin-bottom:14px">
          <h2 id="form-title">➕ سؤال جديد</h2>
          <form id="add-form" class="q-form" autocomplete="off">
            <textarea id="new-q" rows="2" maxlength="500" placeholder="نص السؤال"></textarea>
            <div class="ans-row">
              <input type="radio" name="new-ans" value="0" checked title="الإجابة الصح">
              <input type="text" class="new-opt" maxlength="200" placeholder="الاختيار 1">
            </div>
            <div class="ans-row">
              <input type="radio" name="new-ans" value="1" title="الإجابة الصح">
              <input type="text" class="new-opt" maxlength="200" placeholder="الاختيار 2">
            </div>
            <div class="ans-row">
              <input type="radio" name="new-ans" value="2" title="الإجابة الصح">
              <input type="text" class="new-opt" maxlength="200" placeholder="الاختيار 3 (اختياري)">
            </div>
            <div class="ans-row">
              <input type="radio" name="new-ans" value="3" title="الإجابة الصح">
              <input type="text" class="new-opt" maxlength="200" placeholder="الاختيار 4 (اختياري)">
            </div>
            <p class="hint-line">علّم على الدايرة جنب الاختيار الصح. الاختيارات الفاضية بتتجاهل.</p>
            <div class="form-btns">
              <button type="submit" class="primary" id="save-btn">حفظ السؤال</button>
              <button type="button" id="cancel-edit" class="ghost" hidden>إلغاء</button>
            </div>
          </form>
        </div>

        <div class="bank-toolbar">
          <strong>أسئلة الشعبة</strong>
          <button type="button" class="ghost" id="pick-all">☑️ تحديد الكل</button>
        </div>
        <div id="bank-list"></div>

        <div class="exam-builder">
          <h2 style="font-size:15px; color:var(--accent); margin:0 0 6px">📝 اعمل اختبار كامل</h2>
          <p class="hint-line">علّم على الأسئلة اللي عايزها من فوق، واكتب اسم الاختبار، واضغط إنشاء.</p>
          <div class="exam-make">
            <input type="text" id="exam-title" maxlength="120" placeholder="اسم الاختبار (مثال: امتحان منتصف الترم)">
            <button type="button" class="primary" id="exam-make">➕ إنشاء الاختبار</button>
          </div>
        </div>
      </div>

      <!-- لسان الاختبارات -->
      <div data-pane="exams" hidden>
        <div id="exam-list"></div>
      </div>
    </section>

    <div class="picker">
      <select id="track" aria-label="الشعبة">
        <option value="ar">عربي</option>
        <option value="en">انجليزي</option>
      </select>
      <select id="level" aria-label="المستوى">
        <option value="1">الأول</option>
        <option value="2">الثاني</option>
        <option value="3">الثالث</option>
        <option value="4">الرابع</option>
      </select>
    </div>

    <div id="exam-head" hidden></div>
    <div id="status"></div>
    <form id="quiz" autocomplete="off"></form>

    <div class="actions">
      <button id="submit" class="primary" type="button" hidden>تصحيح</button>
      <button id="reset" class="ghost" type="button" hidden>اختبار جديد</button>
      <button id="print-btn" class="ghost" type="button" hidden>🖨️ طباعة</button>
    </div>

    <div id="result" hidden></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="icons.js?v=1"></script>
  <script src="fx.js?v=2"></script>
  <script src="quiz.js"></script>
</body>
</html>
