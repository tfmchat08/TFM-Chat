<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://jifoamltmdgpawpjgrbz.supabase.co wss://jifoamltmdgpawpjgrbz.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>الاختبارات | TFM Chat</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="fx.css?v=1">
  <style>
    :root { --accent:#6e0819; --accent-soft:rgba(110,8,25,.08); --bg:#fff; --card:#fff; --line:#e3e3e3; --text:#111; --muted:#6b6b70; --ok:#1e7b43; --ok-soft:rgba(30,123,67,.1); --bad:#b3261e; --bad-soft:rgba(179,38,30,.08); --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05); }
    html.dark { --accent:#e05a6e; --accent-soft:rgba(224,90,110,.14); --bg:#000; --card:#121212; --line:#2a2a2a; --text:#f2f2f2; --muted:#9a9aa3; --ok-soft:rgba(60,180,110,.14); --bad-soft:rgba(230,90,80,.14); --shadow:none; }
    * { box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; margin:0; padding:16px; min-height:100vh; line-height:1.6; }
    [hidden] { display:none !important; }
    .wrap { max-width:760px; margin:0 auto; }

    /* الهيدر */
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .top-nav { display:flex; align-items:center; gap:10px; flex:1 1 auto; min-width:0; }
    .top-nav h1 { margin:0; font-size:20px; color:var(--accent); white-space:nowrap; }
    .back { color:var(--accent); text-decoration:none; font-weight:700; font-size:14px; padding:6px 10px; border-radius:10px; background:var(--accent-soft); white-space:nowrap; }
    .top-tools { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .top-tools select { padding:6px 8px; font-size:13px; }
    .top-tools button { padding:6px 10px; font-size:13px; min-width:34px; }

    button, select, input { font:inherit; }
    button, select { cursor:pointer; border-radius:10px; border:1px solid var(--accent); background:transparent; color:var(--accent); padding:8px 14px; font-size:14px; }
    select { border-color:var(--line); color:var(--text); background:var(--card); }
    button:disabled { opacity:.5; cursor:default; }
    button.primary { background:var(--accent); color:#fff; }
    button.danger { color:var(--bad); border-color:var(--bad); }
    button.ghost { border-color:var(--line); color:var(--muted); }
    button.icon-btn { font-size:17px; line-height:1.2; }
    button.icon-x { padding:2px 9px; font-size:14px; }

    .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:16px; }
    .card h2 { font-size:16px; margin:0 0 10px; color:var(--accent); }
    .hint-line { font-size:13px; color:var(--muted); margin:0 0 12px; }
    .empty-line { color:var(--muted); font-size:14px; margin:6px 0; }
    .count-pill { display:inline-block; min-width:24px; padding:0 6px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:12px; margin-inline-start:4px; text-align:center; }
    .pill { display:inline-block; font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; margin-inline-start:6px; }
    .pill.draft { background:var(--bad-soft); color:var(--bad); }
    .pill.pub { background:var(--ok-soft); color:var(--ok); }

    /* إضافة امتحان */
    #exam-title, .q-form textarea, .q-form input[type="text"] { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:15px; margin-bottom:10px; }
    .picked-box { border:1px dashed var(--line); border-radius:12px; padding:10px 12px; margin:6px 0 14px; }
    .picked-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
    .picked-head h3 { font-size:14px; margin:0; color:var(--accent); }
    .picked-row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .picked-row:last-child { border-bottom:0; }
    .picked-text { flex:1; }
    #pick-area { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px; }
    .publish-box { margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); }
    .publish-box h3 { font-size:15px; margin:0 0 10px; color:var(--accent); }
    .slots { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; margin-bottom:12px; }
    .slots button { padding:10px 6px; }
    .publish-foot { display:flex; gap:8px; flex-wrap:wrap; }

    /* بنك الأسئلة والفورم */
    .ans-row { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
    .ans-row input[type="text"] { margin:0; flex:1; }
    .ans-row input[type="radio"] { width:18px; height:18px; accent-color:var(--accent); }
    .form-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
    .bank-toolbar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 10px; }
    .bank-item { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--card); }
    .bank-top { display:flex; gap:10px; align-items:flex-start; }
    .bank-top input.pick { width:18px; height:18px; margin-top:4px; flex:0 0 auto; accent-color:var(--accent); }
    .bank-q { font-weight:700; flex:1; }
    .bank-opts { font-size:14px; color:var(--muted); margin:8px 0 10px; padding-inline-start:28px; }
    .exam-meta { font-size:13px; color:var(--muted); margin:2px 0 8px; }
    .row-btns { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .row-btns button { padding:6px 10px; font-size:13px; }

    /* الطالب */
    #exam-head { font-size:20px; font-weight:800; color:var(--accent); margin-bottom:8px; }
    #status { display:inline-block; color:var(--muted); font-size:14px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 12px; margin-bottom:14px; }
    .q { background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin:0 0 12px; box-shadow:var(--shadow); }
    .q.ok { border-inline-start-color:var(--ok); background:var(--ok-soft); }
    .q.bad { border-inline-start-color:var(--bad); background:var(--bad-soft); }
    .q legend { font-weight:700; padding:0; margin-bottom:8px; font-size:16px; }
    .opt { display:flex; gap:10px; align-items:center; padding:10px 12px; margin-bottom:6px; border:1px solid var(--line); border-radius:10px; font-size:15px; cursor:pointer; background:var(--bg); }
    .opt:hover, .opt:has(input:checked) { border-color:var(--accent); }
    .opt:has(input:checked) { background:var(--accent-soft); }
    .opt input { width:18px; height:18px; flex:0 0 auto; accent-color:var(--accent); }
    .hint { font-size:14px; margin-top:8px; font-weight:600; }
    .hint.ok { color:var(--ok); }
    .hint.bad { color:var(--bad); }
    .actions { display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; }
    .actions button { padding:12px 20px; font-size:16px; }
    #result { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; font-size:18px; font-weight:800; text-align:center; box-shadow:var(--shadow); color:var(--accent); }

    @media print {
      body { background:#fff; color:#000; padding:0; }
      .topbar, #status, .actions, .card, #result { display:none !important; }
      .q { box-shadow:none; break-inside:avoid; border:1px solid #999; }
      .opt { border:1px solid #ccc; background:#fff; }
    }
  
    .sheet-back { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
    .sheet { width:100%; max-width:760px; max-height:92vh; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:18px 18px 0 0; padding:16px 16px 24px; }
    .sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .sheet-head h2 { margin:0; font-size:18px; color:var(--accent); }
    .row2 { display:flex; gap:8px; margin-bottom:10px; }
    .row2 select { flex:1; padding:10px; font-size:15px; }
    .slot-btn.sel { background:var(--accent); color:#fff; }
    .qb { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
    .qb-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:700; color:var(--accent); }
    .qb textarea, .qb input[type="text"] { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:15px; margin-bottom:8px; }
    .qb .ans-row input[type="text"] { margin:0; }
    .wide { width:100%; margin-top:8px; }
    .big { padding:13px; font-size:16px; }
  </style>
</head>
<body>
  <div class="wrap">

    <header class="topbar">
      <div class="top-nav">
        <a class="back" href="./" data-ar="→ رجوع للشات" data-en="← Back to chat">→ رجوع للشات</a>
        <h1 data-ar="الاختبارات" data-en="Quizzes">الاختبارات</h1>
      </div>
      <div class="top-tools">
        <button id="lang-toggle" class="ghost" type="button" title="Language">EN</button>
        <button id="theme-toggle" class="icon-btn ghost" type="button" title="الوضع الداكن">🌙</button>
        <button id="history-btn" class="icon-btn ghost" type="button" title="سجل الامتحانات" hidden>🕘</button>
        <button id="create-open" class="icon-btn primary" type="button" title="إضافة اختبار" hidden>＋</button>
      </div>
    </header>

    <!-- قايمة إضافة اختبار: بتطلع من تحت (للأستاذ) -->
    <div id="sheet" class="sheet-back" hidden>
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="sheet-head">
          <h2 data-ar="إضافة اختبار" data-en="Add a quiz">إضافة اختبار</h2>
          <button type="button" id="sheet-close" class="ghost icon-x" title="إغلاق">✕</button>
        </div>
        <div class="row2">
          <select id="c-level" aria-label="المستوى">
            <option value="1" data-ar="المستوى الأول" data-en="Level 1">المستوى الأول</option>
            <option value="2" data-ar="المستوى الثاني" data-en="Level 2">المستوى الثاني</option>
            <option value="3" data-ar="المستوى الثالث" data-en="Level 3">المستوى الثالث</option>
            <option value="4" data-ar="المستوى الرابع" data-en="Level 4">المستوى الرابع</option>
          </select>
          <select id="c-track" aria-label="الشعبة">
            <option value="ar" data-ar="عربي" data-en="Arabic">عربي</option>
            <option value="en" data-ar="إنجليزي" data-en="English">إنجليزي</option>
          </select>
        </div>
        <input type="text" id="exam-title" maxlength="120" data-ph-ar="اسم الاختبار" data-ph-en="Quiz name" placeholder="اسم الاختبار">
        <p class="hint-line" data-ar="الاختبار ده لأنهي شات؟" data-en="Which chat is this quiz for?">الاختبار ده لأنهي شات؟</p>
        <div class="slots" id="slots">
          <button type="button" class="slot-btn" data-slot="1" data-ar="شات 1" data-en="Chat 1">شات 1</button>
          <button type="button" class="slot-btn" data-slot="2" data-ar="شات 2" data-en="Chat 2">شات 2</button>
          <button type="button" class="slot-btn" data-slot="3" data-ar="شات 3" data-en="Chat 3">شات 3</button>
          <button type="button" class="slot-btn" data-slot="4" data-ar="شات 4" data-en="Chat 4">شات 4</button>
          <button type="button" class="slot-btn" data-slot="5" data-ar="شات 5" data-en="Chat 5">شات 5</button>
        </div>
        <div id="q-blocks"></div>
        <button type="button" id="add-q" class="ghost wide" data-ar="＋ إضافة سؤال" data-en="＋ Add a question">＋ إضافة سؤال</button>
        <button type="button" id="publish" class="primary wide big">📤 نشر</button>
      </div>
    </div>

    <!-- سجل الامتحانات (للأدمن) -->
    <section id="history-box" class="card" hidden>
      <h2><span data-ar="🕘 سجل الامتحانات" data-en="🕘 Exam history">🕘 سجل الامتحانات</span> <span class="count-pill" id="count-hist">0</span></h2>
      <div id="history-list"></div>
    </section>

    <!-- الامتحان (بيظهر بس من رابط ?exam=ID) -->
    <div id="exam-head" hidden></div>
    <div id="status" hidden></div>
    <form id="quiz" autocomplete="off"></form>

    <div class="actions">
      <button id="submit" class="primary" type="button" data-ar="تصحيح" data-en="Check" hidden>تصحيح</button>
      <button id="reset" class="ghost" type="button" data-ar="إعادة المحاولة" data-en="Try again" hidden>إعادة المحاولة</button>
      <button id="print-btn" class="ghost" type="button" data-ar="🖨️ طباعة" data-en="🖨️ Print" hidden>🖨️ طباعة</button>
    </div>

    <div id="result" hidden></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="icons.js?v=1"></script>
  <script src="fx.js?v=2"></script>
  <script src="quiz.js?v=5"></script>
</body>
</html>
